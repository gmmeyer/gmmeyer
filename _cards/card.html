<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 1200×630 social card. Filled from the query string by build.py:
     ?title=…&desc=…&kicker=…&byline=… -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    padding: 76px 88px 60px;
    border-top: 14px solid #0b5fa5;
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { flex: 1; min-height: 0; margin-bottom: 32px; overflow: hidden; }
  .kicker {
    margin-bottom: 26px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6b6b6b;
  }
  h1 {
    font-size: 88px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.025em;
  }
  .desc {
    margin-top: 28px;
    font-size: 34px;
    line-height: 1.4;
    color: #6b6b6b;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 26px;
    border-top: 2px solid #e4e4e4;
    font-size: 28px;
  }
  .byline { font-weight: 650; }
  .site { color: #0b5fa5; }
</style>
</head>
<body>
<main>
  <p class="kicker"></p>
  <h1></h1>
  <p class="desc"></p>
</main>
<footer>
  <span class="byline"></span>
  <span class="site">gmmeyer.com</span>
</footer>
<script>
  const q = new URLSearchParams(location.search);
  for (const [sel, key] of [[".kicker", "kicker"], ["h1", "title"], [".desc", "desc"], [".byline", "byline"]]) {
    const el = document.querySelector(sel);
    if (q.get(key)) el.textContent = q.get(key); else el.remove();
  }
  // Shrink long titles until the text block fits above the footer.
  const main = document.querySelector("main");
  const h1 = document.querySelector("h1");
  let size = 88;
  while (main.scrollHeight > main.clientHeight && size > 48) {
    h1.style.fontSize = (size -= 4) + "px";
  }
</script>
</body>
</html>
