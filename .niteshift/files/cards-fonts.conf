<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts for rendering _cards/card.html in the sandbox. The committed cards were
     rendered on macOS in the system font (-apple-system, i.e. SF Pro); Inter is the
     closest font installed here, so it stands in rather than Liberation Sans. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
  </match>
</fontconfig>
